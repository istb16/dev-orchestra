name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the pinned tools
        run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: Shell scripts parse cleanly
        run: |
          for script in install/*.sh bin/dev-orchestra; do
            sh -n "$script"
          done
      - name: PowerShell scripts parse cleanly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw "$($_.Name): $($errors[0].Message)" }
          }

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the pinned tools
        run: pip install -r requirements-dev.txt
      - name: pyright
        # Settings are in pyproject.toml: `scripts`, Python 3.11, every platform.
        run: pyright

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # The runner gives up on a hung class after 600s; this is the backstop.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest and the newest supported; the ones between seldom break alone.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure git for snapshot tests
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: Run tests
        # No AI CLI is installed here on purpose: the suite must pass without
        # claude or codex on PATH, and must never invoke a real CLI. The tests
        # hide them and refuse to start one themselves (tests/cli_guard), so
        # that holds whatever the runner image has installed.
        # The runner is the same discover, one test class per worker process.
        # On Windows, tests/test_installers.py runs the .ps1 installers under
        # both pwsh and Windows PowerShell 5.1.
        run: python tests/run_parallel.py -v

  installers-windows:
    # The test suite leaves sh out on Windows, and runs the .ps1 installers
    # only from Python. This runs each installer the way a user would, in
    # Git Bash, pwsh and Windows PowerShell 5.1, over an AGENTS.md with
    # Japanese text in it (#292, #294).
    name: Installers on Windows (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - name: Installers are idempotent and leave AGENTS.md as it was (Git Bash)
        if: matrix.shell == 'bash'
        run: |
          set -eu
          tmp=$(cygpath -u "$RUNNER_TEMP")
          proj="$tmp/proj"
          mkdir -p "$proj/.git/info"
          # Japanese text, in octal escapes to keep this file ASCII.
          printf '# \351\226\213\347\231\272\n\346\227\245\346\234\254\n' > "$proj/AGENTS.md"
          cp "$proj/AGENTS.md" "$tmp/AGENTS.md.orig"
          ./install/install.sh --project "$proj"
          ./install/install.sh --project "$proj"
          test -f "$proj/.claude/skills/dev-orchestra/skills/dev-orchestra/SKILL.md"
          # Git Bash's ln -s copies; the installer replaces that with the payload.
          test ! -e "$proj/.claude/skills/dev-orchestra/.git"
          test "$(grep -cxF '/.claude/skills/dev-orchestra' "$proj/.git/info/exclude")" -eq 1
          ./install/install.sh --codex --project "$proj"
          ./install/install.sh --codex --project "$proj"
          test "$(grep -c 'BEGIN dev-orchestra' "$proj/AGENTS.md")" -eq 1
          ./install/uninstall.sh --project "$proj"
          ./install/uninstall.sh --codex --project "$proj"
          test ! -e "$proj/.claude/skills/dev-orchestra"
          test "$(grep -c 'dev-orchestra' "$proj/.git/info/exclude" || true)" -eq 0
          cmp "$proj/AGENTS.md" "$tmp/AGENTS.md.orig"
          ./install/install.sh --antigravity --project "$proj"
          ./install/install.sh --antigravity --project "$proj"
          test -e "$proj/.agents/plugins/dev-orchestra/skills/dev-orchestra/SKILL.md"
          ./install/uninstall.sh --antigravity --project "$proj"
          test ! -e "$proj/.agents/plugins/dev-orchestra"
      - name: Installers are idempotent and leave AGENTS.md as it was (PowerShell)
        if: matrix.shell != 'bash'
        run: |
          $ErrorActionPreference = 'Stop'
          # The PowerShell running this step: pwsh, or Windows PowerShell 5.1.
          $exe = (Get-Process -Id $PID).Path
          function Invoke-Installer {
              param([string]$Name)
              & $exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\install\$Name.ps1" @args
              if ($LASTEXITCODE -ne 0) { throw "$Name.ps1 $args exited $LASTEXITCODE" }
          }
          function Assert-True {
              param([bool]$Condition, [string]$Message)
              if (-not $Condition) { throw $Message }
          }
          $proj = Join-Path $env:RUNNER_TEMP 'proj'
          New-Item -ItemType Directory -Force -Path (Join-Path $proj '.git\info') | Out-Null
          $agents = Join-Path $proj 'AGENTS.md'
          $exclude = Join-Path $proj '.git\info\exclude'
          # Japanese text, built from code points to keep this file ASCII.
          $text = '# ' + [char]0x958B + [char]0x767A + "`n" + [char]0x65E5 + [char]0x672C + "`n"
          $original = (New-Object System.Text.UTF8Encoding($false)).GetBytes($text)
          [System.IO.File]::WriteAllBytes($agents, $original)

          Invoke-Installer install -Project $proj
          Invoke-Installer install -Project $proj
          Assert-True (Test-Path -LiteralPath (Join-Path $proj '.claude\skills\dev-orchestra\skills\dev-orchestra\SKILL.md')) 'Claude install missing'
          $lines = @([System.IO.File]::ReadAllLines($exclude) | Where-Object { $_ -eq '/.claude/skills/dev-orchestra' })
          Assert-True ($lines.Count -eq 1) "exclude entry written $($lines.Count) times"
          Invoke-Installer install -Codex -Project $proj
          Invoke-Installer install -Codex -Project $proj
          $blocks = @([System.IO.File]::ReadAllLines($agents) | Where-Object { $_ -like '*BEGIN dev-orchestra*' })
          Assert-True ($blocks.Count -eq 1) "pointer block written $($blocks.Count) times"
          Invoke-Installer uninstall -Project $proj
          Invoke-Installer uninstall -Codex -Project $proj
          Assert-True (-not (Test-Path -LiteralPath (Join-Path $proj '.claude\skills\dev-orchestra'))) 'Claude install left behind'
          Assert-True (-not ([System.IO.File]::ReadAllText($exclude) -like '*dev-orchestra*')) 'exclude entry left behind'
          $after = [System.IO.File]::ReadAllBytes($agents)
          Assert-True ([Convert]::ToBase64String($after) -eq [Convert]::ToBase64String($original)) 'AGENTS.md changed by the round trip'

          Invoke-Installer install -Antigravity -Project $proj
          Invoke-Installer install -Antigravity -Project $proj
          Assert-True (Test-Path -LiteralPath (Join-Path $proj '.agents\plugins\dev-orchestra\skills\dev-orchestra\SKILL.md')) 'Antigravity install missing'
          Invoke-Installer uninstall -Antigravity -Project $proj
          Assert-True (-not (Test-Path -LiteralPath (Join-Path $proj '.agents\plugins\dev-orchestra'))) 'Antigravity install left behind'

  validate-skill:
    name: Skill validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate the skill and all three hosts' plugin manifests
        run: python scripts/validate_skill.py
      - name: Plugin manifests are well-formed JSON
        run: |
          for manifest in plugin.json .claude-plugin/plugin.json .claude-plugin/marketplace.json .codex-plugin/plugin.json .agents/plugins/marketplace.json; do
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$manifest"
          done
      - name: CLI is runnable from a clean checkout
        run: |
          python scripts/dev_orchestra.py --version
          python scripts/dev_orchestra.py config show
          python scripts/dev_orchestra.py doctor --fast
      - name: Installers are idempotent
        run: |
          ./install/install.sh --project "$RUNNER_TEMP/proj"
          ./install/install.sh --project "$RUNNER_TEMP/proj"
          test -e "$RUNNER_TEMP/proj/.claude/skills/dev-orchestra/skills/dev-orchestra/SKILL.md"
          ./install/install.sh --codex --project "$RUNNER_TEMP/proj"
          ./install/install.sh --codex --project "$RUNNER_TEMP/proj"
          test "$(grep -c 'BEGIN dev-orchestra' "$RUNNER_TEMP/proj/AGENTS.md")" -eq 1
          ./install/uninstall.sh --project "$RUNNER_TEMP/proj"
          ./install/uninstall.sh --codex --project "$RUNNER_TEMP/proj"
          test ! -e "$RUNNER_TEMP/proj/.claude/skills/dev-orchestra"
          test "$(grep -c 'BEGIN dev-orchestra' "$RUNNER_TEMP/proj/AGENTS.md" || true)" -eq 0
          ./install/install.sh --antigravity --project "$RUNNER_TEMP/proj"
          ./install/install.sh --antigravity --project "$RUNNER_TEMP/proj"
          test -e "$RUNNER_TEMP/proj/.agents/plugins/dev-orchestra/skills/dev-orchestra/SKILL.md"
          ./install/uninstall.sh --antigravity --project "$RUNNER_TEMP/proj"
          test ! -e "$RUNNER_TEMP/proj/.agents/plugins/dev-orchestra"
