<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 628" font-family="'BIZ UDGothic', 'Noto Sans Mono CJK JP', 'Noto Sans JP', 'Cascadia Mono', Consolas, monospace">
  <rect width="960" height="628" rx="14" fill="#0f172a"/>
  <rect width="960" height="40" rx="14" fill="#1e293b"/>
  <rect y="26" width="960" height="14" fill="#1e293b"/>
  <circle cx="26" cy="20" r="6" fill="#f87171"/>
  <circle cx="46" cy="20" r="6" fill="#fbbf24"/>
  <circle cx="66" cy="20" r="6" fill="#34d399"/>
  <text x="480" y="25" text-anchor="middle" font-size="13" fill="#94a3b8">claude — demo-app</text>
  <g font-size="15">
    <text x="32" y="82" fill="#e2e8f0"><tspan fill="#14b8a6" font-weight="bold">&gt; </tspan>ログイン API にレート制限を入れて</text>
    <text x="32" y="120" fill="#94a3b8">計画: 新しい挙動・セキュリティに関わる → 全工程で進める</text>
    <text x="32" y="158"><tspan fill="#14b8a6">●</tspan><tspan x="58" fill="#e2e8f0">設計</tspan><tspan x="190"><tspan fill="#94a3b8">architect が計画を書く（読み取り専用）</tspan></tspan></text>
    <text x="32" y="184"><tspan fill="#14b8a6">●</tspan><tspan x="58" fill="#e2e8f0">設計レビュー</tspan><tspan x="190"><tspan fill="#94a3b8">3人で2回: 指摘31件 → 22件を計画に反映</tspan></tspan></text>
    <text x="32" y="210"><tspan fill="#f59e0b">?</tspan><tspan x="58" fill="#e2e8f0">承認</tspan><tspan x="190"><tspan fill="#94a3b8">あなたが計画を読む → </tspan><tspan fill="#14b8a6">はい</tspan></tspan></text>
    <text x="32" y="236"><tspan fill="#14b8a6">●</tspan><tspan x="58" fill="#e2e8f0">実装</tspan><tspan x="190"><tspan fill="#94a3b8">6ファイル、テストも一緒に</tspan></tspan></text>
    <text x="32" y="262"><tspan fill="#14b8a6">●</tspan><tspan x="58" fill="#e2e8f0">テスト</tspan><tspan x="190"><tspan fill="#34d399">✓ 34件成功</tspan></tspan></text>
    <text x="32" y="288"><tspan fill="#14b8a6">●</tspan><tspan x="58" fill="#e2e8f0">レビュー</tspan><tspan x="190"><tspan fill="#94a3b8">同じ差分を並列に、互いの結果を見ずに</tspan></tspan></text>
    <text x="32" y="314"><tspan x="190"><tspan fill="#c4b5fd">Claude</tspan><tspan fill="#e2e8f0"> 全般 ✓ · </tspan><tspan fill="#c4b5fd">Claude</tspan><tspan fill="#e2e8f0"> セキュリティ ✓ · </tspan><tspan fill="#c4b5fd">Claude</tspan><tspan fill="#e2e8f0"> テスト ✓ · </tspan><tspan fill="#7dd3fc">Codex</tspan><tspan fill="#e2e8f0"> 全般 ✓</tspan></tspan></text>
    <text x="32" y="340"><tspan fill="#14b8a6">●</tspan><tspan x="58" fill="#e2e8f0">トリアージ</tspan><tspan x="190"><tspan fill="#94a3b8">重複をまとめ、誤検知を却下</tspan></tspan></text>
    <text x="32" y="366"><tspan fill="#14b8a6">●</tspan><tspan x="58" fill="#e2e8f0">修正</tspan><tspan x="190"><tspan fill="#94a3b8">採用した指摘だけ → 再テスト </tspan><tspan fill="#34d399">✓</tspan></tspan></text>
    <rect x="32" y="398" width="896" height="190" rx="10" fill="#111c33" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="52" y="428" font-size="14" font-weight="bold" fill="#14b8a6">最終報告</text>
    <text x="52" y="458"><tspan fill="#94a3b8">テスト</tspan><tspan x="170"><tspan fill="#34d399">✓</tspan><tspan fill="#e2e8f0"> 37件成功</tspan></tspan></text>
    <text x="52" y="484"><tspan fill="#94a3b8">レビュー</tspan><tspan x="170"><tspan fill="#e2e8f0">4/4 </tspan><tspan fill="#34d399">✓</tspan><tspan fill="#e2e8f0">  （Claude ×3 + Codex）</tspan></tspan></text>
    <text x="52" y="510"><tspan fill="#94a3b8">トリアージ</tspan><tspan x="170"><tspan fill="#e2e8f0">指摘12件 → 採用5、却下3、重複4</tspan></tspan></text>
    <text x="52" y="536"><tspan fill="#94a3b8">変更</tspan><tspan x="170"><tspan fill="#e2e8f0">app/ratelimit.py、app/server.py ほか4ファイル（テスト、README）</tspan></tspan></text>
    <text x="52" y="562"><tspan fill="#94a3b8">残り</tspan><tspan x="170"><tspan fill="#e2e8f0">なし</tspan></tspan></text>
    <text x="928" y="614" text-anchor="end" font-size="12" fill="#64748b">サンプルアプリで実際に動かした結果 · dev-orchestra 1.0.0</text>
  </g>
</svg>
