# Tooling configuration only. This project is not a pip package: it runs
# straight from the checkout with the standard library, so there is no
# [project] table and nothing to build or install.

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".ai", ".tmpcfg"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "B",   # bugbear
    "C4",  # comprehensions
    "RUF", # ruff-specific
]
ignore = [
    # %-formatting is used deliberately and consistently across the codebase.
    "UP031",
    # Asserts in tests are the point.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# These two only re-export what moved into cli_*.py and review_*.py, so every
# `cli.name` and `review.name` in the code and the tests keeps working.
"scripts/orchestrator/cli.py" = ["F401"]
"scripts/orchestrator/review.py" = ["F401"]
# A test replaces a function with setattr() so the checker sees a deliberate
# swap rather than an assignment to a method.
"tests/**" = ["B010"]

[tool.ruff.lint.isort]
known-first-party = ["orchestrator"]

[tool.pyright]
include = ["scripts", "tests"]
# Where the code and the tests import from at run time: the entry point and
# the test runner put these two on sys.path, not an install.
extraPaths = ["scripts", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
# Checked for every platform at once: the code branches on the OS, and the
# Unix branch uses os.killpg and signal.SIGKILL, which a Windows run would
# otherwise report as missing.
pythonPlatform = "All"
# The runtime has no dependencies; PyYAML is used when present and is not
# installed for the check.
reportMissingModuleSource = false
