# Portable descriptor of this skill for hosts that consume YAML agent
# manifests (Codex-family tooling, internal launchers, CI wrappers).
#
# This is METADATA ONLY. The behaviour lives in ../skills/dev-orchestra/SKILL.md, which stays the
# single source of truth -- this file points at it and never restates it.
# Claude Code does not read this file; it reads SKILL.md directly.

schema: agent-manifest/v1
name: dev-orchestra
version: 0.22.0
license: MIT
summary: Multi-model software development orchestration across coding CLIs.

instructions:
  # Read this, then follow it. Do not duplicate its content elsewhere.
  file: ../skills/dev-orchestra/SKILL.md

entrypoint:
  # `command` is what a host that understands nothing else will run;
  # `command_candidates` is the real answer, tried in order until one is on
  # PATH, because Python 3 is installed as `python3` only on many machines and
  # a hardcoded `python` fails outright there. The wrappers below already do
  # this resolution, and are the safer way in for anything that can call them.
  command: python
  command_candidates:
    - python3
    - python
    - py
  args:
    - ../scripts/dev_orchestra.py
  wrappers:
    posix: ../bin/dev-orchestra
    windows: ../bin/dev-orchestra.ps1

requirements:
  python: ">=3.11"
  tools:
    - git
  # The built-in adapters' CLIs; scripts/validate_skill.py keeps this list
  # in step with them.
  optional_clis:
    - agy
    - claude
    - codex

triggers:
  - implement this feature
  - fix this issue
  - investigate and fix
  - implement and review
  - run a multi-model review
  - review the current changes
  - orchestrate development
  - configure development agents
  - change the coding model
  - add a reviewer
  - set up the AI development workflow

roles:
  - id: orchestrator
    description: Classifies the request, selects stages, delegates, reports.
    mode: plan
  - id: architect
    description: Investigation and design. Never edits code.
    mode: plan
    output: plan.md  # under artifacts.directory
  - id: implementer
    description: Writes code and tests from the plan.
    mode: implement
  - id: review_fixer
    description: Fixes findings that survived triage.
    mode: implement
  - id: reviewers
    description: Zero or more independent read-only reviewers.
    mode: review
    cardinality: 0..n

commands:
  # Every command `dev-orchestra --help` lists; scripts/validate_skill.py
  # checks this list against the parser.
  - config show
  - config path
  - config setup
  - config reset
  - config prune
  - config set
  - config validate
  - config suggest-roles
  - model list
  - reviewer list
  - reviewer add
  - reviewer remove
  - reviewer set
  - doctor
  - hooks install
  - hooks uninstall
  - hooks status
  - run
  - review snapshot
  - review run
  - review consolidate
  - review show
  - review triage
  - review fix-brief
  - review status
  - design approve
  - state show
  - state record
  - jobs list
  - jobs show
  - jobs wait
  - jobs cancel
  - budget show
  - budget consume
  - budget reset
  - tokens show
  - optimization report
  - progress record
  - workflow list
  - workflow show
  - workflow use
  - workflow remove
  - status
  - summary

artifacts:
  # One directory per workflow; `workflow show` prints it as `Artifacts:`.
  # A `.ai/...` path in a command's arguments resolves inside it.
  directory: .ai/workflows/<id>
  files:
    - plan.md
    - execution/
    - jobs/
    - reviews/review-target.diff
    - reviews/consolidated.md
    - reviews/consolidated.json
    - reviews/design/
    - state.json

safety:
  reviewers_are_read_only: true
  stores_credentials: false
  requires_network: false
  hardcodes_model_snapshots: false
