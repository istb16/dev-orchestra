# Example global configuration for dev-orchestra.
#
# Copy to:
#   Linux/macOS  ~/.config/dev-orchestra/config.yaml
#   Windows      %APPDATA%\dev-orchestra\config.yaml
#
# or just run:  dev-orchestra config setup
#
# Note what is NOT here: any dated model id. Roles declare a model *family* and
# a version policy, and the provider adapter resolves that against the CLI you
# have installed, so this file keeps working after a model release.

version: 1

# Decides which stages to run and writes the final report. A mid-tier model is
# the right trade-off here: it makes routing decisions, not code.
orchestrator:
  provider: claude
  model:
    family: sonnet
    version: latest

# Investigation and design. Read-only: it writes .ai/plan.md and nothing else.
architect:
  provider: claude
  model:
    family: fable
    version: latest

# Writes the code and the tests.
implementer:
  provider: claude
  model:
    family: opus
    version: latest

# Fixes findings that survived triage.
review_fixer:
  provider: claude
  model:
    family: opus
    version: latest

# Independent reviewers. Each sees the same frozen diff, in isolation,
# read-only. Two or more from different vendors is the point of the exercise.
reviewers:
  - id: claude-general
    provider: claude
    model:
      family: opus
      version: latest
    role: general

  - id: codex-general
    provider: codex
    model:
      # Codex publishes no model list, so this resolves by letting the CLI
      # choose its own current default rather than naming a model.
      family: recommended-coding
      version: latest
    role: general

review:
  # Hard stop on review -> fix -> re-review loops. 0 disables re-review.
  max_review_iterations: 2
  # Run reviewers concurrently. Set false to debug one at a time.
  parallel: true
  # Severities that count as blocking when deciding whether to re-review.
  re_review_severities:
    - critical
    - high
  # Per delegated CLI run.
  timeout_seconds: 1800
  # Files whose diff body is withheld from reviewers: generated, vendored or
  # recorded, so nobody wrote them and no reviewer has a useful thought about
  # them. They are still named to the reviewer with their line counts. This
  # list replaces the built-in one wholesale; [] reviews everything.
  exclude:
    - "*.lock"
    - package-lock.json
    - npm-shrinkwrap.json
    - go.sum
    - "dist/*"
    - "*/dist/*"
    - "vendor/*"
    - "*/vendor/*"
    - "node_modules/*"
    - "*/node_modules/*"
    - "*.min.js"
    - "*.min.css"
    - "*.map"
    - "*.snap"
  # A second round diffs against what the first round reviewed, so re-review
  # sees the fix rather than the whole change again. The findings the fix was
  # meant to address travel with it, and the whole change stays on disk for a
  # reviewer that wants the context. false re-diffs everything every round.
  incremental_rounds: true
  # How many findings each reviewer is asked for. Leave unset (null) to let
  # optimization.level decide: 4 aggressive, 6 balanced, 10 quality. A number
  # here overrides the level; 0 lifts the cap. Nothing over the cap is dropped.
  max_findings: null

optimization:
  # How hard to try to be cheap: aggressive | balanced | quality.
  #
  #                              aggressive  balanced  quality
  #   tests recorded as failed   refuse      refuse    review anyway
  #   no test result recorded    warn        warn      review
  #   small low-risk change      1 reviewer  panel     panel
  #   findings asked for         4           6         10
  #
  # The gate reads `state record test ok|failed`; this tool cannot run a
  # project's tests itself. Never recorded warns and continues.
  level: balanced
  # A change touching one of these escalates to `quality` whatever level is
  # set above -- the patterns are yours to replace, the escalation is not
  # yours to switch off. They over-match on purpose: an extra reviewer is
  # cheaper than a missed authorisation bug.
  high_risk_paths:
    - "*auth*"
    - "*login*"
    - "*session*"
    - "*permission*"
    - "*policy*"
    - "*acl*"
    - "*secret*"
    - "*credential*"
    - "*password*"
    - ".env"
    - ".env.*"
    - "*payment*"
    - "*billing*"
    - "*checkout*"
    - "*invoice*"
    - "*.sql"
    - "*migration*/*"
    - "*/migration*/*"
    - "*migrate*/*"
    - "*/migrate*/*"
    - "*schema*"
    - "*crypto*"
    - "*cipher*"
    - Dockerfile
    - "Dockerfile.*"
    - "*.tf"
    - "*/k8s/*"
    - "*/deploy/*"
    - "*/.github/workflows/*"
    - ".github/workflows/*"
  # At `aggressive`, a change under both of these and touching nothing
  # high-risk gets one reviewer instead of the panel.
  low_risk_max_files: 2
  low_risk_max_lines: 50

workspace:
  # Where plan.md, reviews/ and state.json go, relative to the repo root.
  dir: .ai
