# Example project override: copy to <repo>/.dev-orchestra.yaml
#
# Only the keys you set here override your global configuration. Mappings merge
# key by key, so omitting `architect` keeps your personal architect.
#
# One exception worth knowing: LISTS REPLACE WHOLESALE. Defining `reviewers`
# here defines the entire review panel for this repository -- which is exactly
# what you want when a repo needs a specific set of perspectives.
#
# Commit this file when the team should share the panel; leave it uncommitted
# (it is gitignored by default in this repo) when it is just your preference.

version: 1

# This repository is a database-heavy Rails app, so the panel is weighted
# towards migration safety and security rather than two general reviewers.
reviewers:
  - id: claude-general
    provider: claude
    model:
      family: opus
      version: latest
    role: general

  - id: codex-security
    provider: codex
    model:
      family: recommended-coding
      version: latest
    role: security

  - id: codex-database
    provider: codex
    model:
      family: recommended-coding
      version: latest
    role: database

review:
  # Migrations are expensive to get wrong: allow one extra fix/re-review round.
  max_review_iterations: 3

# The rspec suite uses one test database, so units running side by side would
# trip over each other: each unit skips the tests, which run once after every
# unit is merged. Its worktree gets a copy of the git-ignored files rspec needs.
implementation:
  unit_tests: after_merge
  worktree_files:
    - config/database.yml
    - .env.test

# Standing text added to each run's prompt, below the CLI's own rules. These
# lines join any the global configuration sets for the same role.
instructions:
  implementer: "Run tests with bundle exec rspec <files>; never run db:reset."
  reviewers: "Check every new migration for a missing index or a locking change."

# Everything else -- orchestrator, architect, implementer, review_fixer --
# comes from the global configuration.
